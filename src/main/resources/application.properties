# =============================================================
# Smart Bus Tracking System - Spring Boot Application Properties
# Phase 6: Aiven Cloud MySQL Configuration
# =============================================================

spring.application.name=smart-bus-backend
server.port=8080

# =============================================================
# AIVEN CLOUD MYSQL DATABASE CONFIGURATION
# High-Performance JDBC & SSL Configuration
# =============================================================
spring.datasource.url=${DB_URL:jdbc:mysql://mysql-1fadd442-bollanagu6868-7ac8.g.aivencloud.com:10867/defaultdb?useSSL=true&requireSSL=true&sslMode=VERIFY_CA&trustCertificateKeyStoreUrl=file:${SSL_KEYSTORE_PATH:C:/Users/bolla/Downloads/truststore.jks}&trustCertificateKeyStorePassword=${SSL_KEYSTORE_PASSWORD:changeit}&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=false&useUnicode=true&characterEncoding=UTF-8&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&rewriteBatchedStatements=true&cacheResultSetMetadata=true&cacheServerConfiguration=true&elideSetAutoCommits=true&maintainTimeStats=false}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Settings (HikariCP) - Optimized for Aiven Cloud MySQL (max-lifetime < server wait_timeout)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.pool-name=SmartBusHikariPool

# =============================================================
# HTTP COMPRESSION (Faster network delivery for all JSON)
# =============================================================
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=512

# =============================================================
# JPA / HIBERNATE CONFIGURATION
# Schema managed by Flyway migrations
# =============================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.open-in-view=true

# =============================================================
# FLYWAY DATABASE MIGRATION
# =============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# =============================================================
# BREVO / RESEND HTTPS API (Port 443 - Recommended for Cloud)
# =============================================================
brevo.api.key=${BREVO_API_KEY:}
resend.api.key=${RESEND_API_KEY:}

# =============================================================
# SPRING MAIL CONFIGURATION (Gmail SMTPS on Port 465 - SSL)
# =============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=${MAIL_PORT:465}
spring.mail.protocol=smtps
spring.mail.username=${MAIL_USERNAME:bollanagu6868@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.transport.protocol=smtps
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.smtps.auth=true
spring.mail.properties.mail.smtps.ssl.enable=true
spring.mail.properties.mail.smtps.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtps.socketFactory.port=465
spring.mail.properties.mail.smtps.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtps.connectiontimeout=10000
spring.mail.properties.mail.smtps.timeout=10000
spring.mail.properties.mail.smtps.writetimeout=10000

# =============================================================
# JWT CONFIGURATION
# =============================================================
app.jwt.secret=${JWT_SECRET:SmartBusEduTrackSecretKey2024VeryLongSecretForHMACSHA256Algorithm}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}
# 86400000 ms = 24 hours

# =============================================================
# CORS CONFIGURATION
# =============================================================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:5174,https://*.vercel.app}

# =============================================================
# LOGGING
# =============================================================
logging.level.com.smartbus=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.flywaydb=INFO

# =============================================================
# SPRINGDOC / SWAGGER UI
# =============================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000

# =============================================================
# GEMINI AI SMART TRANSPORT ASSISTANT CONFIGURATION
# =============================================================
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
